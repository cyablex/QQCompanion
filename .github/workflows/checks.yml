name: Check source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare isolated core and desktop environments
        run: python tools/bootstrap.py --skip-frontend
      - name: Test using temporary data and fake transports
        run: runtime/python.exe -X utf8 -m pytest tests -q
      - name: Lint project source
        run: runtime/python.exe -X utf8 -m ruff check app plugins/astrbot_plugin_qq_companion tests tools
      - name: Build desktop frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
